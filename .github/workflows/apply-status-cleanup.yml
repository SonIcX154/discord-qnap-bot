name: apply-status-cleanup

# Phone: GitHub → Actions → apply-status-cleanup → Run workflow
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Decode cleaned backup sources
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64, zlib
          from pathlib import Path

          def decode(stem: str, dest: str) -> None:
              a = Path(f"scripts/status_cleanup/{stem}.z64.a").read_text().strip()
              b = Path(f"scripts/status_cleanup/{stem}.z64.b").read_text().strip()
              raw = zlib.decompress(base64.b64decode(a + b))
              Path(dest).write_bytes(raw)
              print(dest, len(raw), "bytes")

          decode("backup_admin.py", "cogs/backup_admin.py")
          decode("backup.py", "cogs/backup.py")
          PY
          python3 -m py_compile cogs/backup_admin.py cogs/backup.py
          if grep -n "backup-status" cogs/backup.py cogs/backup_admin.py; then
            exit 1
          fi
          echo "OK: no backup-status left"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cogs/backup.py cogs/backup_admin.py
          if git diff --staged --quiet; then
            echo "Already applied"
            exit 0
          fi
          git commit -m "chore: remove dead /backup-status from backup cogs"
          git push

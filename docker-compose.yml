version: '3.8'

services:
  discord-qnap-bot:
    build: .
    container_name: discord-qnap-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Birthday data persistence (highly recommended)
      - ./data:/app/data
    # Add more volumes here if you add other cogs that need persistent storage

networks:
  default:
    driver: bridge
